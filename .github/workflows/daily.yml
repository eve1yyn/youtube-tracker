name: YouTube Tracker Daily Collection

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}    # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "youtube-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/youtube_tracker.db
          git diff --staged --quiet || git commit -m "chore: daily YouTube data $(date -u +%F)"
          git push
